spring.application.name=api-gateway
server.port=8080

# ?? RUTAS DEL GATEWAY ????????????????????????????????????????
# Cada ruta tiene:
# - id: nombre identificador de la ruta
# - uri: a donde redirige la peticion
# - predicates: que peticiones captura esta ruta

# User Service - /api/users/**
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

# Auth Service - /api/auth/**
spring.cloud.gateway.routes[1].id=auth-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/**

# Order Service - /api/orders/**
spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**

# Product Service - /api/products/**
spring.cloud.gateway.routes[3].id=product-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/products/**

# Inventory Service - /api/inventory/**
spring.cloud.gateway.routes[4].id=inventory-service
spring.cloud.gateway.routes[4].uri=http://localhost:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/inventory/**

# ?? CORS ?????????????????????????????????????????????????????
# Permite que el frontend React pueda llamar al Gateway
# desde el navegador sin errores de seguridad.
# En produccion cambia * por el dominio exacto del frontend.
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*

# ?? ACTUATOR ?????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# ?? LOGGING ??????????????????????????????????????????????????
logging.level.org.springframework.cloud.gateway=DEBUG